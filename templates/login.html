{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 md:mt-16 px-4">
  <div class="bg-white dark:bg-slate-800 rounded-[2rem] p-8 shadow-xl shadow-sky-100/50 dark:shadow-none border border-slate-200 dark:border-slate-700 hover-scale">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-sky-100 dark:bg-sky-900/30 text-sky-600 dark:text-sky-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <i data-lucide="log-in" class="w-6 h-6"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight" data-i18n="log_title">Akkauntqa Kiriw</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-2" data-i18n="log_sub">Jeke kabinet hám qabıllarǵa jazılıw ushın</p>
    </div>

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 ml-1" data-i18n="reg_login">Login (Username):</label>
        <input type="text" name="username" required
               class="w-full px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 text-xs lowercase">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 ml-1" data-i18n="reg_pass">Parol:</label>
        <div class="relative">
          <input type="password" name="password" id="login-password" required
                 class="w-full pl-4 pr-10 py-3 rounded-2xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 text-xs">
          <button type="button" class="toggle-password-btn absolute right-3 top-3.5 text-slate-400 hover:text-sky-600" data-target="login-password">
            <i data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
      
      <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 rounded-2xl mt-4 transition-all shadow-md shadow-sky-200 dark:shadow-none active:scale-95">
        <span data-i18n="log_btn">Kiriw</span>
      </button>
    </form>
    
    <div class="mt-6 text-center text-xs text-slate-500 dark:text-slate-400 border-t border-slate-100 dark:border-slate-700 pt-4 flex items-center justify-center gap-1">
      <span data-i18n="log_no_acc">Akkauntıńız joq pa?</span> <a href="{{ url_for('register') }}" class="text-sky-600 dark:text-sky-400 font-bold hover:underline" data-i18n="log_reg_link">Dizimnen ótiw</a>
    </div>
  </div>
</div>
{% endblock %}
