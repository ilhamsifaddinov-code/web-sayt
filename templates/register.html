{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 md:mt-16 px-4">
  <div class="bg-white dark:bg-slate-800 rounded-[2rem] p-8 shadow-xl shadow-sky-100/50 dark:shadow-none border border-slate-200 dark:border-slate-700 hover-scale">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-sky-100 dark:bg-sky-900/30 text-sky-600 dark:text-sky-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <i data-lucide="user-plus" class="w-6 h-6"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight" data-i18n="reg_title">Dizimnen Ótiw</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-2" data-i18n="reg_sub">20% jeńillikke iye bolıń hám qániygelerge jazılıń</p>
    </div>

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 ml-1" data-i18n="reg_name">Atı-familiyańız:</label>
        <input type="text" name="full_name" required
               class="w-full px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 text-xs">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 ml-1" data-i18n="reg_login">Login (Username):</label>
        <input type="text" name="username" required
               class="w-full px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 text-xs lowercase">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 ml-1" data-i18n="reg_phone">Telefon nomerińiz:</label>
        <div class="flex">
          <select name="country_code" id="country_code" class="pl-2 pr-1 py-3 rounded-l-2xl border border-r-0 border-slate-200 dark:border-slate-600 bg-slate-100 dark:bg-slate-600 text-slate-900 dark:text-white text-xs font-bold focus:outline-none">
            <option value="+998" data-len="9">🇺🇿 UZB (+998)</option>
            <option value="+7" data-len="10">🇷🇺 RUS (+7)</option>
            <option value="+7" data-len="10">🇰🇿 KAZ (+7)</option>
            <option value="+996" data-len="9">🇰🇬 KGZ (+996)</option>
            <option value="+993" data-len="8">🇹🇲 TKM (+993)</option>
            <option value="+992" data-len="9">🇹🇯 TJK (+992)</option>
            <option value="+1" data-len="10">🇺🇸 USA (+1)</option>
            <option value="+44" data-len="10">🇬🇧 GBR (+44)</option>
            <option value="+90" data-len="10">🇹🇷 TUR (+90)</option>
            <option value="+82" data-len="10">🇰🇷 KOR (+82)</option>
          </select>
          <input type="tel" name="phone_number" id="phone_number" required placeholder="901234567"
                 class="w-full px-3 py-3 rounded-r-2xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 text-xs">
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 ml-1" data-i18n="reg_pass">Parol jaratıń:</label>
        <div class="relative">
          <input type="password" name="password" id="reg-password" required
                 class="w-full pl-4 pr-10 py-3 rounded-2xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 text-xs">
          <button type="button" class="toggle-password-btn absolute right-3 top-3.5 text-slate-400 hover:text-sky-600" data-target="reg-password">
            <i data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
      
      <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 rounded-2xl mt-4 transition-all shadow-md shadow-sky-200 dark:shadow-none active:scale-95">
        <span data-i18n="reg_btn">Dizimnen ótiw</span>
      </button>
    </form>
    
    <div class="mt-6 text-center text-xs text-slate-500 dark:text-slate-400 border-t border-slate-100 dark:border-slate-700 pt-4">
      <p>Akkauntıńız bar ma? <a href="{{ url_for('login') }}" class="text-sky-600 dark:text-sky-400 font-bold hover:underline" data-i18n="nav_login">Kiriw</a></p>
    </div>
  </div>
</div>
{% endblock %}
